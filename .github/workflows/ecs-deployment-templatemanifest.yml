name: Reusable ECS Deployment (Blue-Green)

on:
  workflow_call:
    inputs:
      image-tag:
        description: "ECR image tag (commit SHA or latest)"
        required: true
        type: string
      environment:
        description: "Deployment environment (dev, qa, prod)"
        required: true
        type: string
        default: 'dev'
      app-language:
        description: "Application app-language (csharp, java, node, python)"
        required: true
        type: string
      temp-listener-port:
        description: "Port for temporary listener for testing new version of code"
        required: false
        type: string
        default: "8081"

    outputs:
      LIVE_SERVICE:
        value: ${{ jobs.ecs-deploy.outputs.LIVE_SERVICE }}
      IDLE_SERVICE:
        value: ${{ jobs.ecs-deploy.outputs.IDLE_SERVICE }}
      IDLE_TG:
        value: ${{ jobs.ecs-deploy.outputs.IDLE_TG }}
      TEMP_LISTENER_ARN:
        value: ${{ jobs.ecs-deploy.outputs.TEMP_LISTENER_ARN }}
      IS_FIRST_DEPLOY: 
        value: ${{ jobs.ecs-deploy.outputs.IS_FIRST_DEPLOY }}
      MAIN_ALB_LISTENER_ARN:
        value: ${{ jobs.ecs-deploy.outputs.MAIN_ALB_LISTENER_ARN }}

jobs:
  ecs-deploy:
    name: Deploying to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      LIVE_SERVICE: ${{ steps.set-services.outputs.LIVE_SERVICE }}
      IDLE_SERVICE: ${{ steps.set-services.outputs.IDLE_SERVICE }}
      IDLE_TG: ${{ steps.set-services.outputs.IDLE_TG }}
      TEMP_LISTENER_ARN: ${{ steps.app_endpoint_test.outputs.TEMP_LISTENER_ARN }}
      MAIN_ALB_LISTENER_ARN: ${{ steps.app_endpoint_test.outputs.MAIN_ALB_LISTENER_ARN }}
      IS_FIRST_DEPLOY: ${{ steps.set-services.outputs.IS_FIRST_DEPLOY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNTID }}:role/GitHubActionsECSDeployRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Load environment manifest
        id: load-manifest
        run: |
          set -e
          ENV="${{ inputs.environment }}"
          MANIFEST_FILE="manifest/manifest-ecs.yml"

          echo "📘 Reading ECS manifest for environment: $ENV"
          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "❌ Manifest file not found at $MANIFEST_FILE"
            exit 1
          fi

          # Convert environment section to JSON
          yq -o=json ".environments.$ENV" "$MANIFEST_FILE" > manifest.json

          echo "✅ Loaded manifest.json content:"
          cat manifest.json | jq .

          echo "🌱 Flattening manifest values..."

          # Core service values
          SERVICE_NAME=$(yq -r ".environments.$ENV.service.name" "$MANIFEST_FILE")
          CLUSTER_NAME=$(yq -r ".environments.$ENV.service.aws.cluster" "$MANIFEST_FILE")
          DESIRED_COUNT=$(yq -r ".environments.$ENV.service.aws.desiredCount" "$MANIFEST_FILE")
          EXECUTION_ROLE_NAME=$(yq -r ".environments.$ENV.service.aws.executionRoleName" "$MANIFEST_FILE")
          ECR_REPO_NAME=$(yq -r ".environments.$ENV.service.aws.ecrreponame" "$MANIFEST_FILE")

          # Container configuration
          CPU=$(yq -r ".environments.$ENV.service.container.cpu" "$MANIFEST_FILE")
          MEMORY=$(yq -r ".environments.$ENV.service.container.memory" "$MANIFEST_FILE")
          CONTAINER_PORT=$(yq -r ".environments.$ENV.service.container.port" "$MANIFEST_FILE")

          # Load Balancer and Target Groups
          ALB_ARN=$(yq -r ".environments.$ENV.service.aws.alb.arn" "$MANIFEST_FILE")
          ALB_LISTENER_ARN=$(yq -r ".environments.$ENV.service.aws.alb.mainlisteners.arn" "$MANIFEST_FILE")
          TG_BLUE=$(yq -r ".environments.$ENV.service.aws.targetGroups.blue" "$MANIFEST_FILE")
          TG_GREEN=$(yq -r ".environments.$ENV.service.aws.targetGroups.green" "$MANIFEST_FILE")

          # Network Configuration
          ASSIGN_PUBLIC_IP=$(yq -r ".environments.$ENV.service.aws.networkConfiguration.assignPublicIp" "$MANIFEST_FILE")
          SUBNETS=$(yq -r ".environments.$ENV.service.aws.networkConfiguration.subnets | join(\",\")" "$MANIFEST_FILE")
          SECURITY_GROUPS=$(yq -r ".environments.$ENV.service.aws.networkConfiguration.securityGroups | join(\",\")" "$MANIFEST_FILE")

          # Write ECS and container values to GITHUB_ENV
          {
            echo "SERVICE_NAME=$SERVICE_NAME"
            echo "CLUSTER_NAME=$CLUSTER_NAME"
            echo "DESIRED_COUNT=$DESIRED_COUNT"
            echo "EXECUTION_ROLE_NAME=$EXECUTION_ROLE_NAME"
            echo "ECR_REPO_NAME=$ECR_REPO_NAME"
            echo "CPU=$CPU"
            echo "MEMORY=$MEMORY"
            echo "CONTAINER_PORT=$CONTAINER_PORT"
            echo "ALB_ARN=$ALB_ARN"
            echo "ALB_LISTENER_ARN=$ALB_LISTENER_ARN"
            echo "TARGET_GROUP_BLUE=$TG_BLUE"
            echo "TARGET_GROUP_GREEN=$TG_GREEN"
            echo "ASSIGN_PUBLIC_IP=$ASSIGN_PUBLIC_IP"
            echo "SUBNETS=$SUBNETS"
            echo "SECURITY_GROUPS=$SECURITY_GROUPS"
          } >> $GITHUB_ENV

          # # --- Dynamically extract container environmentVariables[] ---
          # echo "🌍 Loading container environment variables..."
          # jq -r '.service.container.environmentVariables[] | "\(.name)=\(.value)"' manifest.json >> $GITHUB_ENV

          # echo "✅ Final environment variables loaded into job:"
          cat $GITHUB_ENV | sed 's/^/   /'

      - name: Determine Idle Service (Blue/Green)
        id: set-services
        run: |
          echo "Detected base service name: $SERVICE_NAME"

          EXISTING_SERVICES=$(aws ecs list-services --cluster "$CLUSTER_NAME" \
            --query "serviceArns[?contains(@, '$SERVICE_NAME')]" \
            --output text)

          if [ -z "$EXISTING_SERVICES" ]; then
            echo "🟢 First-time deployment detected (no ECS service found)."
            IS_FIRST_DEPLOY=true
            LIVE_SERVICE="blue"
            IDLE_SERVICE="blue"
            echo "IS_FIRST_DEPLOY=$IS_FIRST_DEPLOY" >> $GITHUB_OUTPUT
            echo "LIVE_SERVICE=$LIVE_SERVICE" >> $GITHUB_OUTPUT
            echo "IDLE_SERVICE=$IDLE_SERVICE" >> $GITHUB_OUTPUT
            echo "IDLE_TG=$TARGET_GROUP_BLUE" >> $GITHUB_OUTPUT
            echo "Active Service: $LIVE_SERVICE, Idle Service: $IDLE_SERVICE , Is First Time Deployment: $IS_FIRST_DEPLOY"
            exit 0
          fi
          ACTIVE_TG=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$ALB_ARN" \
              --query 'Listeners[0].DefaultActions[0].TargetGroupArn' \
              --output text)

          if [ "$ACTIVE_TG" == "$TARGET_GROUP_BLUE" ]; then
              LIVE_SERVICE="blue"
              IDLE_SERVICE="green"
              IDLE_TG="$TARGET_GROUP_GREEN"
          else
              LIVE_SERVICE="green"
              IDLE_SERVICE="blue"
              IDLE_TG="$TARGET_GROUP_BLUE"
          fi
          IS_FIRST_DEPLOY=false
          echo "IS_FIRST_DEPLOY=$IS_FIRST_DEPLOY" >> $GITHUB_OUTPUT
          echo "LIVE_SERVICE=$LIVE_SERVICE" >> $GITHUB_OUTPUT
          echo "IDLE_SERVICE=$IDLE_SERVICE" >> $GITHUB_OUTPUT
          echo "IDLE_TG=$IDLE_TG" >> $GITHUB_OUTPUT
          echo "Active Service: $LIVE_SERVICE, Idle Service: $IDLE_SERVICE , Is First Time Deployment: $IS_FIRST_DEPLOY"
      
      - name: Generate ECS Task Definition
        id: gen-task
        run: |
          set -e

          IMAGE_TAG="${{ inputs.image-tag }}"
          ECR_IMAGE="${{ vars.AWS_ACCOUNTID }}.dkr.ecr.us-east-2.amazonaws.com/${{ vars.AWS_ECR_REPO }}:${IMAGE_TAG}"
          APP_LANGUAGE="${{ inputs.app-language }}"
          ENVIRONMENT="${{ inputs.environment }}"

          # ECS core values (loaded from previous job via $GITHUB_ENV)
          TASK_FAMILY="$SERVICE_NAME-task"
          CONTAINER_NAME="$SERVICE_NAME-container"

          # Load container environment variables dynamically from manifest
          ENV_VARS=$(yq -o=json ".environments.$ENVIRONMENT.service.container.environmentVariables" manifest/manifest-ecs.yml)

          # Append language-specific vars dynamically
          case "$APP_LANGUAGE" in
            csharp)
              ENV_VARS=$(echo "$ENV_VARS" | jq '[.[]] + [
                {"name":"DOTNET_RUNNING_IN_CONTAINER","value":"true"},
                {"name":"ASPNETCORE_URLS","value":"http://+:8080"},
                {"name":"LIVE_SERVICE","value":"${{ steps.set-services.outputs.IDLE_SERVICE }}"},
                {"name":"APP_LANGUAGE","value":"${{ inputs.app-language }}"},
                {"name":"ENVIRONMENT","value":"${{ inputs.environment }}"}
              ]')
              ;;
            java)
              ENV_VARS=$(echo "$ENV_VARS" | jq '[.[]] + [
                {"name":"JAVA_TOOL_OPTIONS","value":"-Dfile.encoding=UTF-8"},
                {"name":"LIVE_SERVICE","value":"${{ steps.set-services.outputs.IDLE_SERVICE }}"}
              ]')
              ;;
            node)
              ENV_VARS=$(echo "$ENV_VARS" | jq '[.[]] + [
                {"name":"NODE_ENV","value":"production"},
                {"name":"LIVE_SERVICE","value":"${{ steps.set-services.outputs.IDLE_SERVICE }}"}
              ]')
              ;;
            python)
              ENV_VARS=$(echo "$ENV_VARS" | jq '[.[]] + [
                {"name":"PYTHONUNBUFFERED","value":"1"},
                {"name":"LIVE_SERVICE","value":"${{ steps.set-services.outputs.IDLE_SERVICE }}"}
              ]')
              ;;
          esac

          # Build ECS task definition JSON
          cat <<EOF > task-def.json
          {
            "family": "$TASK_FAMILY",
            "networkMode": "awsvpc",
            "executionRoleArn": "arn:aws:iam::${{ vars.AWS_ACCOUNTID }}:role/$EXECUTION_ROLE_NAME",
            "containerDefinitions": [
              {
                "name": "$CONTAINER_NAME",
                "image": "$ECR_IMAGE",
                "portMappings": [{"containerPort":$CONTAINER_PORT}],
                "essential": true,
                "environment": $ENV_VARS,
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/$TASK_FAMILY",
                    "awslogs-region": "${{ vars.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "$CPU",
            "memory": "$MEMORY"
          }
          EOF

      - name: Register ECS Task Definition
        run: aws ecs register-task-definition --cli-input-json file://task-def.json

      - name: Deploy Idle ECS Service
        run: |
          TASK_FAMILY="$SERVICE_NAME-task"
          CONTAINER_NAME="$SERVICE_NAME-container"
          SERVICE_NAME="$SERVICE_NAME-${{ steps.set-services.outputs.IDLE_SERVICE }}"
          IDLE_TG=${{ steps.set-services.outputs.IDLE_TG }}

          echo "SERVICE_NAME is $SERVICE_NAME and Task $TASK_FAMILY , DESIRED_COUNT is $DESIRED_COUNT, CLUSTER_NAME is $CLUSTER_NAME, CONTAINER_NAME is $CONTAINER_NAME"

          SERVICE_STATUS=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")

          if [ "$SERVICE_STATUS" == "ACTIVE" ]; then
            aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE_NAME" --task-definition "$TASK_FAMILY" --desired-count "$DESIRED_COUNT" --force-new-deployment
          else
            NETWORK_CONFIG=$(cat <<EOF
          {
            "awsvpcConfiguration": {
              "subnets": $(echo "$SUBNETS" | jq -R 'split(",")'),
              "securityGroups": $(echo "$SECURITY_GROUPS" | jq -R 'split(",")'),
              "assignPublicIp": "$ASSIGN_PUBLIC_IP"
            }
          }
          EOF
          )
            aws ecs create-service \
            --cluster "$CLUSTER_NAME" \
            --service-name "$SERVICE_NAME" \
            --task-definition "$TASK_FAMILY" \
            --desired-count "$DESIRED_COUNT" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --load-balancers targetGroupArn=$IDLE_TG,containerName=$CONTAINER_NAME,containerPort=8080
          fi

      # 6️⃣ Wait for ECS service to stabilize
      - name: Wait for ECS service to stabilize
        run: |
          SERVICE_NAME="$SERVICE_NAME-${{ steps.set-services.outputs.IDLE_SERVICE }}"
          echo "Waiting for ECS service '$SERVICE_NAME' to become active..."
          # Loop until service exists and is stable, or timeout
          MAX_RETRIES=30
          SLEEP_INTERVAL=20
          RETRY=0
          while true; do
              SERVICE_STATUS=$(aws ecs describe-services \
                  --cluster "$CLUSTER_NAME" \
                  --services "$SERVICE_NAME" \
                  --query 'services[0].status' \
                  --output text 2>/dev/null || echo "NONE")

              if [[ "$SERVICE_STATUS" == "ACTIVE" ]]; then
                  echo "⏳ Service is active. Waiting for stability..."
                  aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME"
                  echo "✅ ECS service is stable"
                  break
              elif [[ "$SERVICE_STATUS" == "DRAINING" ]]; then
                  echo "Service is draining. Waiting for cleanup..."
                  aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME"
                  echo "✅ ECS service drained"
                  break
              elif [[ "$SERVICE_STATUS" == "NONE" || "$SERVICE_STATUS" == "INACTIVE" ]]; then
                  echo "Service not active yet. Retrying in $SLEEP_INTERVAL seconds..."
              else
                  echo "Service status: $SERVICE_STATUS. Retrying in $SLEEP_INTERVAL seconds..."
              fi
              RETRY=$((RETRY+1))
              if [[ $RETRY -ge $MAX_RETRIES ]]; then
                  echo "⚠️ Timeout waiting for ECS service. Proceeding anyway..."
                  break
              fi
              sleep $SLEEP_INTERVAL
          done
      
      # 3️⃣ Validate Idle Target Group Health
      - name: Validate Idle Target Group Health
        id: check-health
        run: |
          IDLE_TG=${{ steps.set-services.outputs.IDLE_TG }}
          echo "Checking target health for idle TG: $IDLE_TG..."
          # Get target health info
          TARGETS=$(aws elbv2 describe-target-health --target-group-arn "$IDLE_TG" \
            --query 'TargetHealthDescriptions[*].{Id:Target.Id,Port:Target.Port,State:TargetHealth.State}' \
            --output json)
          echo "Target Health:"
          echo "$TARGETS" | jq -r '.[] | "🔹 \(.Id):\(.Port) → \(.State)"'
          # Count healthy targets
          HEALTHY_COUNT=$(echo "$TARGETS" | jq '[.[] | select(.State=="healthy")] | length')
          echo "✅ Healthy targets count: $HEALTHY_COUNT"
          if [ "$HEALTHY_COUNT" -eq 0 ]; then
            echo "❌ No healthy targets available. Deployment cannot continue."
            exit 1
          fi
          echo "healthy_count=$HEALTHY_COUNT" >> $GITHUB_OUTPUT

      # 8️⃣ Application Endpoint URL (Dynamic)
      - name: Application Endpoint URL
        id: app_endpoint_test
        run: |
          TEMP_PORT=${{ inputs.temp-listener-port }}
          IDLE_TG=${{ steps.set-services.outputs.IDLE_TG }}
          IS_FIRST_DEPLOY=${{ steps.set-services.outputs.IS_FIRST_DEPLOY }}

          echo "Fetching ALB DNS..."
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --load-balancer-arns "$ALB_ARN" \
            --query 'LoadBalancers[0].DNSName' --output text)

          if [[ "$IS_FIRST_DEPLOY" == "true" ]]; then
            echo "🟢 First deployment detected — testing main endpoint only."
            TEST_URL="http://${ALB_DNS}/health"
            TEMP_LISTENER_ARN="none"
          else
            echo "🟡 Creating temporary listener on port $TEMP_PORT for validation..."
            TEMP_LISTENER_ARN=$(aws elbv2 create-listener \
              --load-balancer-arn "$ALB_ARN" \
              --protocol HTTP \
              --port "$TEMP_PORT" \
              --default-actions Type=forward,TargetGroupArn="$IDLE_TG" \
              --query 'Listeners[0].ListenerArn' --output text)

            TEST_URL="http://${ALB_DNS}:${TEMP_PORT}/health"
            echo "✅ Temporary listener created on port $TEMP_PORT"
          fi

          echo "🔗 Testing Application Endpoint: $TEST_URL"
          echo "TEMP_LISTENER_ARN=$TEMP_LISTENER_ARN" >> $GITHUB_OUTPUT
          echo "TEST_URL=$TEST_URL" >> $GITHUB_OUTPUT
          echo "MAIN_ALB_LISTENER_ARN=$ALB_LISTENER_ARN" >> $GITHUB_OUTPUT

      #  🧹 Cleanup old ECS task definitions (keep last 5, skip active ones)
      - name: Cleanup old ECS Task Definitions
        if: always()
        run: |
          set -euo pipefail
          # Color codes
          YELLOW='\033[1;33m'
          GREEN='\033[1;32m'
          NC='\033[0m' # No Color
          TASK_FAMILY="$SERVICE_NAME-task"
          KEEP_LAST=5

          echo -e "🔍 Fetching task definitions for family: ${YELLOW}$TASK_FAMILY${NC}..."
          # Get all revisions sorted from oldest to newest
          REVISIONS=$(aws ecs list-task-definitions \
              --family-prefix "$TASK_FAMILY" \
              --sort ASC \
              --query 'taskDefinitionArns' \
              --output text)
          TOTAL=$(echo $REVISIONS | wc -w)
          DELETE_COUNT=$((TOTAL - KEEP_LAST))

          if [ $DELETE_COUNT -le 0 ]; then
              echo -e "✅ Nothing to delete. Total revisions: ${GREEN}$TOTAL${NC}"
              exit 0
          fi

          # Find task definitions in use by any active services in the cluster, but only for this task family
          ACTIVE_IN_USE=()
          for svc in $(aws ecs list-services --cluster "$CLUSTER_NAME" --query 'serviceArns' --output text); do
              td=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$svc" \
                  --query 'services[].taskDefinition' --output text)

              # Only keep task definitions that match our family
              if [[ "$td" == *"$TASK_FAMILY"* ]]; then
                  ACTIVE_IN_USE+=("$td")
                  echo -e "🔎 Active task definition ${YELLOW}$TASK_FAMILY${NC} in use by service ${GREEN}$svc${NC}"
              fi
          done

          # Remove duplicates and sort
          ACTIVE_IN_USE=($(printf "%s\n" "${ACTIVE_IN_USE[@]}" | sort -u))

          # Revisions to attempt deletion
          TO_DELETE=$(echo $REVISIONS | awk -v c=$DELETE_COUNT '{for(i=1;i<=c;i++) print $i}')
          KEPT=()

          echo "🗑️ Checking and deleting old task definition revisions..."
          for rev in $TO_DELETE; do
              if printf '%s\n' "${ACTIVE_IN_USE[@]}" | grep -qx "$rev"; then
                  echo -e "⏭️ Skipping ${YELLOW}$rev${NC} (still in use by one or more services)"
                  KEPT+=("$rev")
              else
                  echo -e "🗑️ Deleting ${YELLOW}$rev${NC}"
                  aws ecs deregister-task-definition --task-definition "$rev" \
                      --query 'taskDefinition.taskDefinitionArn' --output text >/dev/null
              fi
          done

          # Add the remaining last $KEEP_LAST revisions to KEPT
          REMAINING=$(echo $REVISIONS | awk -v c=$DELETE_COUNT '{for(i=c+1;i<=NF;i++) print $i}')
          for r in $REMAINING; do KEPT+=("$r"); done

          echo -e "✅ Cleanup complete. Kept last $KEEP_LAST revisions, skipped active ones:"
          for r in "${KEPT[@]}"; do
              echo -e "   - ${YELLOW}$r${NC}"
          done