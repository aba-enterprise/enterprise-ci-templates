# =============================================================================
#  Reusable CI workflow  - ci-template.yml
#  Location: <org>/ci-workflows/.github/workflows/ci-template.yml
#
#  Scope: CI ONLY (build, test, scan, publish artifact). Deployment lives in a
#  SEPARATE per-app repository and is not handled here.
#
#  Runners: self-hosted AWS CodeBuild (backend: codebuild) or k8s/ARC
#  (backend: k8s), Windows or Linux, with PRE-BAKED images. No toolchain setup
#  is performed - every runtime/tool must already be on the image PATH.
#
#  Set centrally by this workflow (intentionally NOT settable by app teams):
#    - restore command : per-language (npm ci / dotnet restore / mvn ... / nuget restore)
#    - job timeout     : 20 minutes (30 for Windows builds)
# =============================================================================

name: Reusable CI

on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to the per-repo CI values file."
        type: string
        default: ci-config/config.yml
      bootstrap-runner:
        description: >
          Runner label for the lightweight Linux helper jobs (config, security).
          Point at a k8s/ARC Linux scale-set label, e.g. 'arc-linux'.
        type: string
        default: ubuntu-latest
      environment:
        description: >
          Deploy target whose service endpoints to resolve from
          policy/pipeline-defaults.yml (environments.<name>). CI runs against
          non-prod tooling; production promotion passes 'prod'.
        type: string
        default: nonprod

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) preflight  - The pipeline-config action merges the per-app
  #    ci-config/config.yml with the central policy/ (pipeline-policy.yml +
  #    pipeline-defaults.yml), schema-validates them, and emits typed outputs.
  # ---------------------------------------------------------------------------
  Preflight:
    name: Preflight (config, policy & defaults constants)
    runs-on: ${{ inputs.bootstrap-runner }}
    timeout-minutes: 5
    outputs:
      name:            ${{ steps.parse.outputs.name }}
      language:        ${{ steps.parse.outputs.language }}
      language_version: ${{ steps.parse.outputs.language_version }}
      type:            ${{ steps.parse.outputs.type }}
      runner_backend:  ${{ steps.parse.outputs.runner_backend }}
      runner_labels:   ${{ steps.parse.outputs.runner_labels }}
      runner_os:       ${{ steps.parse.outputs.runner_os }}
      working_dir:     ${{ steps.parse.outputs.working_dir }}
      restore_cmd:     ${{ steps.parse.outputs.restore_cmd }}
      build_cmd:       ${{ steps.parse.outputs.build_cmd }}
      test_cmd:        ${{ steps.parse.outputs.test_cmd }}
      lint_cmd:        ${{ steps.parse.outputs.lint_cmd }}
      artifact_path:   ${{ steps.parse.outputs.artifact_path }}
      project_path:    ${{ steps.parse.outputs.project_path }}
      test_project_path: ${{ steps.parse.outputs.test_project_path }}
      coverage_report: ${{ steps.parse.outputs.coverage_report }}
      dockerfile_path: ${{ steps.parse.outputs.dockerfile_path }}
      job_timeout:     ${{ steps.parse.outputs.job_timeout }}
      # scan identifiers (from per-app config)
      sonar_project_key: ${{ steps.parse.outputs.sonar_project_key }}
      sonar_org_key:     ${{ steps.parse.outputs.sonar_org_key }}
      sast_profile:      ${{ steps.parse.outputs.sast_profile }}
      image_repository:  ${{ steps.parse.outputs.image_repository }}
      codeql_lang:       ${{ steps.parse.outputs.codeql_lang }}
      # gate decisions (from central policy/pipeline-policy.yml — NOT app-overridable)
      gate_test:        ${{ steps.parse.outputs.gate_test }}
      gate_coverage:    ${{ steps.parse.outputs.gate_coverage }}
      coverage_min:     ${{ steps.parse.outputs.coverage_min }}
      run_sonar:        ${{ steps.parse.outputs.run_sonar }}
      run_sonar_gate:   ${{ steps.parse.outputs.run_sonar_gate }}
      run_veracode:     ${{ steps.parse.outputs.run_veracode }}
      run_veracode_gate: ${{ steps.parse.outputs.run_veracode_gate }}
      run_prisma:       ${{ steps.parse.outputs.run_prisma }}
      run_prisma_gate:  ${{ steps.parse.outputs.run_prisma_gate }}
      run_dependency:   ${{ steps.parse.outputs.run_dependency }}
      run_secret:       ${{ steps.parse.outputs.run_secret }}
      run_codeql:       ${{ steps.parse.outputs.run_codeql }}
      # service endpoints (from central policy/pipeline-defaults.yml)
      #   common.*  — one org-wide instance
      environment:      ${{ steps.parse.outputs.environment }}
      registry_host:    ${{ steps.parse.outputs.registry_host }}
      registry_namespace: ${{ steps.parse.outputs.registry_namespace }}
      sonarqube_url:     ${{ steps.parse.outputs.sonarqube_url }}
      sonarqube_quality_gate: ${{ steps.parse.outputs.sonarqube_quality_gate }}
      veracode_api_base: ${{ steps.parse.outputs.veracode_api_base }}
      veracode_policy:  ${{ steps.parse.outputs.veracode_policy }}
      #   environments.<environment>.*  — per deploy target
      vault_addr:       ${{ steps.parse.outputs.vault_addr }}
      vault_role:       ${{ steps.parse.outputs.vault_role }}
      artifactory_url:  ${{ steps.parse.outputs.artifactory_url }}
      artifactory_docker_repo: ${{ steps.parse.outputs.artifactory_docker_repo }}
      artifactory_maven_repo:  ${{ steps.parse.outputs.artifactory_maven_repo }}
      artifactory_npm_repo:    ${{ steps.parse.outputs.artifactory_npm_repo }}
      prisma_console_url: ${{ steps.parse.outputs.prisma_console_url }}
      prisma_collection: ${{ steps.parse.outputs.prisma_collection }}
    steps:
      - uses: actions/checkout@v4

      - name: Load config, policy and defaults
        id: parse
        uses: aba-enterprise/enterprise-ci-templates/actions/pipeline-config@feature-ciconfig
        with:
          config-path: ${{ inputs.config-path }}
          environment: ${{ inputs.environment }}

  # ---------------------------------------------------------------------------
  # 2) build_test  - restore / lint / build / test on the app's own runner.
  #    No toolchain setup: images are pre-baked; commands use PATH.
  # ---------------------------------------------------------------------------
  Build_Test:
    name: Build & Test
    needs: Preflight
    # runs-on: >-
    #   ${{ needs.Preflight.outputs.runner_backend == 'codebuild'
    #       && format('codebuild-{0}-{1}-{2}', needs.Preflight.outputs.runner_labels, github.run_id, github.run_attempt)
    #       || needs.Preflight.outputs.runner_labels }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ===================== LINUX stages (bash) =============================
      - name: Restore dependencies (linux)
        if: needs.Preflight.outputs.runner_os != 'windows' && needs.Preflight.outputs.restore_cmd != ''
        working-directory: ${{ needs.Preflight.outputs.working_dir }}
        shell: bash
        env: { CMD: "${{ needs.Preflight.outputs.restore_cmd }}" }
        run: eval "$CMD"

      - name: Lint (linux)
        if: needs.Preflight.outputs.runner_os != 'windows' && needs.Preflight.outputs.lint_cmd != ''
        working-directory: ${{ needs.Preflight.outputs.working_dir }}
        shell: bash
        env: { CMD: "${{ needs.Preflight.outputs.lint_cmd }}" }
        run: eval "$CMD"

      - name: Build (linux)
        if: needs.Preflight.outputs.runner_os != 'windows' && needs.Preflight.outputs.build_cmd != ''
        working-directory: ${{ needs.Preflight.outputs.working_dir }}
        shell: bash
        env: { CMD: "${{ needs.Preflight.outputs.build_cmd }}" }
        run: eval "$CMD"

      - name: Test (linux)
        if: needs.Preflight.outputs.runner_os != 'windows' && needs.Preflight.outputs.test_cmd != ''
        working-directory: ${{ needs.Preflight.outputs.working_dir }}
        shell: bash
        env: { CMD: "${{ needs.Preflight.outputs.test_cmd }}" }
        run: eval "$CMD"

