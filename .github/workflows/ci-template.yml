# =============================================================================
#  Reusable CI workflow  - ci-template.yml
#  Location: <org>/ci-workflows/.github/workflows/ci-template.yml
#
#  Scope: CI ONLY (build, test, scan, publish artifact). Deployment lives in a
#  SEPARATE per-app repository and is not handled here.
#
#  Runners: self-hosted AWS CodeBuild (backend: codebuild) or k8s/ARC
#  (backend: k8s), Windows or Linux, with PRE-BAKED images. No toolchain setup
#  is performed - every runtime/tool must already be on the image PATH.
#
#  Set centrally by this workflow (intentionally NOT settable by app teams):
#    - restore command : per-language (npm ci / dotnet restore / mvn ... / nuget restore)
#    - job timeout     : 20 minutes (30 for Windows builds)
# =============================================================================

name: Reusable CI

on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to the per-repo CI values file."
        type: string
        default: ci-config/config.yml
      bootstrap-runner:
        description: >
          Runner label for the lightweight Linux helper jobs (config, security).
          Point at a k8s/ARC Linux scale-set label, e.g. 'arc-linux'.
        type: string
        default: ubuntu-latest
      environment:
        description: >
          Deploy target whose service endpoints to resolve from
          policy/pipeline-defaults.yml (environments.<name>). CI runs against
          non-prod tooling; production promotion passes 'prod'.
        type: string
        default: nonprod

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) load-ci-config  - Parse ci-config/config.yml into typed job outputs.
  # ---------------------------------------------------------------------------
  load-ci-config:
    runs-on: ${{ inputs.bootstrap-runner }}
    timeout-minutes: 5
    outputs:
      name:            ${{ steps.parse.outputs.name }}
      language:        ${{ steps.parse.outputs.language }}
      language_version: ${{ steps.parse.outputs.language_version }}
      type:            ${{ steps.parse.outputs.type }}
      runner_backend:  ${{ steps.parse.outputs.runner_backend }}
      runner_labels:   ${{ steps.parse.outputs.runner_labels }}
      runner_os:       ${{ steps.parse.outputs.runner_os }}
      working_dir:     ${{ steps.parse.outputs.working_dir }}
      restore_cmd:     ${{ steps.parse.outputs.restore_cmd }}
      build_cmd:       ${{ steps.parse.outputs.build_cmd }}
      test_cmd:        ${{ steps.parse.outputs.test_cmd }}
      lint_cmd:        ${{ steps.parse.outputs.lint_cmd }}
      artifact_path:   ${{ steps.parse.outputs.artifact_path }}
      project_path:    ${{ steps.parse.outputs.project_path }}
      test_project_path: ${{ steps.parse.outputs.test_project_path }}
      coverage_report: ${{ steps.parse.outputs.coverage_report }}
      dockerfile_path: ${{ steps.parse.outputs.dockerfile_path }}
      # scan identifiers (from per-app config)
      sonar_project_key: ${{ steps.parse.outputs.sonar_project_key }}
      sonar_org_key:     ${{ steps.parse.outputs.sonar_org_key }}
      sast_profile:      ${{ steps.parse.outputs.sast_profile }}
      image_repository:  ${{ steps.parse.outputs.image_repository }}
      codeql_lang:       ${{ steps.parse.outputs.codeql_lang }}
      # gate decisions (from central policy/pipeline-policy.yml — NOT app-overridable)
      gate_test:        ${{ steps.parse.outputs.gate_test }}
      gate_coverage:    ${{ steps.parse.outputs.gate_coverage }}
      coverage_min:     ${{ steps.parse.outputs.coverage_min }}
      run_sonar:        ${{ steps.parse.outputs.run_sonar }}
      run_sonar_gate:   ${{ steps.parse.outputs.run_sonar_gate }}
      run_veracode:     ${{ steps.parse.outputs.run_veracode }}
      run_veracode_gate: ${{ steps.parse.outputs.run_veracode_gate }}
      run_prisma:       ${{ steps.parse.outputs.run_prisma }}
      run_prisma_gate:  ${{ steps.parse.outputs.run_prisma_gate }}
      run_dependency:   ${{ steps.parse.outputs.run_dependency }}
      run_secret:       ${{ steps.parse.outputs.run_secret }}
      run_codeql:       ${{ steps.parse.outputs.run_codeql }}
      # service endpoints (from central policy/pipeline-defaults.yml)
      #   common.*  — one org-wide instance
      environment:      ${{ steps.parse.outputs.environment }}
      registry_host:    ${{ steps.parse.outputs.registry_host }}
      registry_namespace: ${{ steps.parse.outputs.registry_namespace }}
      sonarqube_url:     ${{ steps.parse.outputs.sonarqube_url }}
      sonarqube_quality_gate: ${{ steps.parse.outputs.sonarqube_quality_gate }}
      veracode_api_base: ${{ steps.parse.outputs.veracode_api_base }}
      veracode_policy:  ${{ steps.parse.outputs.veracode_policy }}
      #   environments.<environment>.*  — per deploy target
      vault_addr:       ${{ steps.parse.outputs.vault_addr }}
      vault_role:       ${{ steps.parse.outputs.vault_role }}
      artifactory_url:  ${{ steps.parse.outputs.artifactory_url }}
      artifactory_docker_repo: ${{ steps.parse.outputs.artifactory_docker_repo }}
      artifactory_maven_repo:  ${{ steps.parse.outputs.artifactory_maven_repo }}
      artifactory_npm_repo:    ${{ steps.parse.outputs.artifactory_npm_repo }}
      prisma_console_url: ${{ steps.parse.outputs.prisma_console_url }}
      prisma_collection: ${{ steps.parse.outputs.prisma_collection }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout org policy
        uses: actions/checkout@v4
        with:
          repository: aba-enterprise/enterprise-ci-templates
          ref: main
          path: .policy-src
          sparse-checkout: policy
          sparse-checkout-cone-mode: false

      - id: parse
        shell: bash
        env:
          CONFIG: ${{ inputs.config-path }}
          POLICY: .policy-src/policy/pipeline-policy.yml
          COMMON: .policy-src/policy/pipeline-defaults.yml
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          command -v yq >/dev/null 2>&1 || {
            echo "::error::'yq' not found on the bootstrap runner image. Add it to the image."; exit 1; }

          if [ ! -f "$CONFIG" ]; then
            echo "::error::CI config not found at '$CONFIG'"; exit 1
          fi
          if [ ! -f "$POLICY" ]; then
            echo "::error::pipeline-policy.yml not found — cannot run without central policy"; exit 1
          fi
          if [ ! -f "$COMMON" ]; then
            echo "::error::pipeline-defaults.yml not found — cannot run without central defaults"; exit 1
          fi

          get()  { yq "$1 // \"\"" "$CONFIG"; }
          pol()  { yq "$1 // \"\"" "$POLICY"; }
          # shared non-secret default; usage: com '.common.runner.os'
          com()  { yq "$1 // \"\"" "$COMMON"; }
          # a gate is ON unless policy says gate == warn; 'required:false' disables the stage
          gate() { [ "$(pol "$1.gate")" = "warn" ] && echo "no" || echo "yes"; }
          reqd() { [ "$(pol "$1.required")" = "false" ] && echo "false" || echo "true"; }

          # environment-scoped service endpoint; usage: envd '.vault.addr'
          ENVIRONMENT="${ENVIRONMENT:-nonprod}"
          if [ "$(com ".environments.${ENVIRONMENT}")" = "" ]; then
            echo "::error::environment '${ENVIRONMENT}' not defined in pipeline-defaults.yml (expected nonprod|prod)"; exit 1
          fi
          envd() { yq ".environments.${ENVIRONMENT}$1 // \"\"" "$COMMON"; }

          LANGUAGE=$(get '.metadata.language')
          RUNNER_OS=$(yq '.ci.runner.os // "linux"' "$CONFIG")
          DOCKERFILE=$(get '.build.dockerfilePath')
          IMAGE_REPO=$(get '.scan.image.repository'); [ -n "$IMAGE_REPO" ] || IMAGE_REPO=$(get '.metadata.name')

          # imageScan only applies when the app actually builds an image
          if [ -n "$DOCKERFILE" ] && [ "$(reqd '.imageScan')" = "true" ]; then RUN_PRISMA=true; else RUN_PRISMA=false; fi

          # Restore command is owned by the workflow (per language), NOT by app
          # teams it is intentionally not read from config. Java assumes Maven.
          case "$LANGUAGE" in
            node)             RESTORE="npm ci" ;;
            dotnet)           RESTORE="dotnet restore" ;;
            java)             RESTORE="mvn -B dependency:go-offline" ;;
            python)           RESTORE="pip install -r requirements.txt" ;;
            dotnet-framework) RESTORE="nuget restore" ;;
            *)                RESTORE="" ;;
          esac

          # Job timeout is owned by the workflow, NOT by app teams. Windows builds
          # (e.g. .NET Framework) get more time; everything else uses 20 minutes.
          if [ "$RUNNER_OS" = "windows" ]; then TIMEOUT=30; else TIMEOUT=20; fi

          case "$LANGUAGE" in
            node)   CODEQL="javascript-typescript" ;;
            dotnet) CODEQL="csharp" ;;
            java)   CODEQL="java-kotlin" ;;
            python) CODEQL="python" ;;
            *)      CODEQL="" ;;
          esac

          {
            echo "name=$(get '.metadata.name')"
            echo "language=${LANGUAGE}"
            echo "language_version=$(get '.metadata.languageVersion')"
            echo "type=$(get '.metadata.type')"
            echo "runner_backend=$(yq '.ci.runner.backend // "codebuild"' "$CONFIG")"
            echo "runner_labels=$(yq '.ci.runner.labels // "self-hosted"' "$CONFIG")"
            echo "runner_os=${RUNNER_OS}"
            echo "working_dir=$(yq '.build.workingDirectory // "."' "$CONFIG")"
            echo "restore_cmd=${RESTORE}"
            echo "build_cmd=$(get '.build.buildCommand')"
            echo "test_cmd=$(get '.test.command')"
            echo "lint_cmd=$(get '.quality.lint')"
            echo "artifact_path=$(get '.build.artifactPath')"
            echo "project_path=$(get '.build.projectPath')"
            echo "test_project_path=$(get '.test.testProjectPath')"
            echo "coverage_report=$(get '.test.coverageReport')"
            echo "dockerfile_path=${DOCKERFILE}"

            # --- scan identifiers (per-app config) ---
            echo "sonar_project_key=$(get '.scan.codeQuality.projectKey')"
            echo "sonar_org_key=$(get '.scan.codeQuality.organizationKey')"
            echo "sast_profile=$(get '.scan.sast.profile')"
            echo "image_repository=${IMAGE_REPO}"
            echo "codeql_lang=${CODEQL}"

            # --- gate decisions (central policy/pipeline-policy.yml, app-immutable) ---
            echo "gate_test=$(gate '.test')"
            echo "gate_coverage=$(gate '.test.coverage')"
            echo "coverage_min=$(pol '.test.coverage.minPercent')"
            echo "run_sonar=$(reqd '.codeQuality')"
            echo "run_sonar_gate=$(gate '.codeQuality')"
            echo "run_veracode=$(reqd '.sast')"
            echo "run_veracode_gate=$(gate '.sast')"
            echo "run_prisma=${RUN_PRISMA}"
            echo "run_prisma_gate=$(gate '.imageScan')"
            echo "run_dependency=$(reqd '.dependencyScan')"
            echo "run_secret=$(reqd '.secretScan')"
            echo "run_codeql=$(reqd '.sast_codeql')"

            # --- service endpoints (central policy/pipeline-defaults.yml) ---
            echo "environment=${ENVIRONMENT}"
            echo "registry_host=$(com '.common.registry.host')"
            echo "registry_namespace=$(com '.common.registry.namespace')"
            echo "sonarqube_url=$(com '.common.sonarqube.url')"
            echo "sonarqube_quality_gate=$(com '.common.sonarqube.qualityGate')"
            echo "veracode_api_base=$(com '.common.veracode.apiBase')"
            echo "veracode_policy=$(com '.common.veracode.policy')"
            echo "vault_addr=$(envd '.vault.addr')"
            echo "vault_role=$(envd '.vault.role')"
            echo "artifactory_url=$(envd '.artifactory.url')"
            echo "artifactory_docker_repo=$(envd '.artifactory.dockerRepo')"
            echo "artifactory_maven_repo=$(envd '.artifactory.mavenRepo')"
            echo "artifactory_npm_repo=$(envd '.artifactory.npmRepo')"
            echo "prisma_console_url=$(envd '.prisma.consoleUrl')"
            echo "prisma_collection=$(envd '.prisma.collection')"
          } >> "$GITHUB_OUTPUT"

          echo "Parsed '${LANGUAGE}' | env=${ENVIRONMENT} backend=$(yq '.ci.runner.backend // "codebuild"' "$CONFIG") os=${RUNNER_OS}"

  # ---------------------------------------------------------------------------
  # 2) build_test  - restore / lint / build / test on the app's own runner.
  #    No toolchain setup: images are pre-baked; commands use PATH.
  # ---------------------------------------------------------------------------
  Build_Test:
    needs: load-ci-config
    # runs-on: >-
    #   ${{ needs.load-ci-config.outputs.runner_backend == 'codebuild'
    #       && format('codebuild-{0}-{1}-{2}', needs.load-ci-config.outputs.runner_labels, github.run_id, github.run_attempt)
    #       || needs.load-ci-config.outputs.runner_labels }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ===================== LINUX stages (bash) =============================
      - name: Restore dependencies (linux)
        if: needs.load-ci-config.outputs.runner_os != 'windows' && needs.load-ci-config.outputs.restore_cmd != ''
        working-directory: ${{ needs.load-ci-config.outputs.working_dir }}
        shell: bash
        env: { CMD: "${{ needs.load-ci-config.outputs.restore_cmd }}" }
        run: eval "$CMD"

      - name: Lint (linux)
        if: needs.load-ci-config.outputs.runner_os != 'windows' && needs.load-ci-config.outputs.lint_cmd != ''
        working-directory: ${{ needs.load-ci-config.outputs.working_dir }}
        shell: bash
        env: { CMD: "${{ needs.load-ci-config.outputs.lint_cmd }}" }
        run: eval "$CMD"

      - name: Build (linux)
        if: needs.load-ci-config.outputs.runner_os != 'windows' && needs.load-ci-config.outputs.build_cmd != ''
        working-directory: ${{ needs.load-ci-config.outputs.working_dir }}
        shell: bash
        env: { CMD: "${{ needs.load-ci-config.outputs.build_cmd }}" }
        run: eval "$CMD"

      - name: Test (linux)
        if: needs.load-ci-config.outputs.runner_os != 'windows' && needs.load-ci-config.outputs.test_cmd != ''
        working-directory: ${{ needs.load-ci-config.outputs.working_dir }}
        shell: bash
        env: { CMD: "${{ needs.load-ci-config.outputs.test_cmd }}" }
        run: eval "$CMD"

