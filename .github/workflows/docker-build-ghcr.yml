name: Reusable Docker Build & Push (GHCR)

on:
  workflow_call:
    inputs:
      app-language:
        description: "Application language (csharp, java, node, python)"
        required: true
        type: string
      language-version:
        description: "Runtime version (e.g., .NET 8, Java 17, Node 20, Python 3.11)"
        required: true
        type: string
      project-path:
        description: "Project root path"
        required: false
        type: string
        default: "."
      dockerfile-path:
        description: "Dockerfile path"
        required: false
        type: string
        default: "./Dockerfile"
      environment:
        description: "Deployment environment (dev, qa, prod)"
        required: true
        type: string
        default: "dev"
      image-tag:
        description: "Optional Docker image tag (default: github.sha)"
        required: false
        type: string

    outputs:
      IMAGE_TAG:
        description: "Generated Docker image tag"
        value: ${{ jobs.docker-build.outputs.IMAGE_TAG }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    permissions:
      contents: read
      packages: write     # 👈 allows push to GHCR

    outputs:
      IMAGE_TAG: ${{ steps.docker_build.outputs.IMAGE_TAG }}

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup runtime (based on app-language)
      - name: Setup .NET
        if: ${{ inputs.app-language == 'csharp' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.language-version }}

      - name: Setup Java
        if: ${{ inputs.app-language == 'java' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.language-version }}

      - name: Setup Node.js
        if: ${{ inputs.app-language == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.language-version }}

      - name: Setup Python
        if: ${{ inputs.app-language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.language-version }}

      # 3️⃣ Build artifacts (language-specific)
      - name: Build artifacts
        id: build-artifacts
        run: |
          PROJECT_PATH="${{ inputs.project-path }}"
          APP_LANGUAGE="${{ inputs.app-language }}"
          ARTIFACT_PATH="$PROJECT_PATH/output"

          rm -rf "$ARTIFACT_PATH"
          mkdir -p "$ARTIFACT_PATH"

          echo "Building artifacts for $APP_LANGUAGE from $PROJECT_PATH → $ARTIFACT_PATH"

          if [ "$APP_LANGUAGE" == "csharp" ]; then
              CSPROJ_FILE=$(find "$PROJECT_PATH" -maxdepth 1 -name "*.csproj" | head -n 1)
              [ -z "$CSPROJ_FILE" ] && echo "❌ No .csproj found" && exit 1
              dotnet restore "$CSPROJ_FILE"
              dotnet publish "$CSPROJ_FILE" -c Release -o "$ARTIFACT_PATH" --no-self-contained

          elif [ "$APP_LANGUAGE" == "java" ]; then
              if [ -f "$PROJECT_PATH/mvnw" ]; then
                "$PROJECT_PATH/mvnw" clean package -DskipTests -f "$PROJECT_PATH"
              else
                mvn clean package -DskipTests
              fi
              cp target/*.jar "$ARTIFACT_PATH/"

          elif [ "$APP_LANGUAGE" == "node" ]; then
              cd "$PROJECT_PATH"
              npm install
              npm run build
              cp -r dist/* "$ARTIFACT_PATH/"

          elif [ "$APP_LANGUAGE" == "python" ]; then
              cp -r "$PROJECT_PATH"/* "$ARTIFACT_PATH/"

          else
              echo "⚠️ Unsupported language: $APP_LANGUAGE"
              exit 1
          fi

          echo "artifact-path=output" >> $GITHUB_OUTPUT

      # 4️⃣ Login to GHCR
      - name: Login to GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 5️⃣ Build and Push Docker Image to GHCR
      - name: Build and Push Docker Image
        id: docker_build
        run: |
          PROJECT_PATH="${{ inputs.project-path }}"
          DOCKERFILE_PATH="${{ inputs.dockerfile-path }}"
          ENVIRONMENT="${{ inputs.environment }}"

          SERVICE_NAME=$(basename ${{ github.repository }})
          BRANCH_NAME=${GITHUB_REF##*/}
          IMAGE_TAG=${{ inputs.image-tag != '' && inputs.image-tag || github.sha }}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          # Define GHCR image names
          IMAGE_BASE="ghcr.io/${{ github.repository }}"
          IMAGE_TAG_FINAL="${SERVICE_NAME}-${SHORT_SHA}"
          IMAGE_BRANCH_TAG="${SERVICE_NAME}-${BRANCH_NAME}"

          echo "📦 Building image: $IMAGE_BASE"
          echo "🧩 Tags: $IMAGE_TAG_FINAL, $IMAGE_BRANCH_TAG"

          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE_BASE:$IMAGE_TAG_FINAL" \
            -t "$IMAGE_BASE:$IMAGE_BRANCH_TAG" \
            --build-arg APP_LANGUAGE="${{ inputs.app-language }}" \
            --build-arg LANGUAGE_VERSION="${{ inputs.language-version }}" \
            --build-arg ENVIRONMENT="$ENVIRONMENT" \
            "$PROJECT_PATH"

          echo "🚀 Pushing image to GHCR..."
          docker push "$IMAGE_BASE:$IMAGE_TAG_FINAL"
          docker push "$IMAGE_BASE:$IMAGE_BRANCH_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG_FINAL" >> $GITHUB_OUTPUT

      # 6️⃣ Save and Upload Docker Image Tag for CD Workflow
      - name: Save Docker Image Tag
        run: echo "IMAGE_TAG=${{ steps.docker_build.outputs.IMAGE_TAG }}" > image-tag.env

      - name: Upload Image Tag Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tag
          path: image-tag.env
