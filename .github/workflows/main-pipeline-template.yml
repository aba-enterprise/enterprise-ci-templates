  Build-Application-and-Docker-Image:
    name: Build Application and Docker Image
    needs: [Repository-Contribution-Compliance]
    uses: CRBG-PhoenixPOC/central-devops-config/.github/workflows/docker-build-template.yml@main
    with:
      app-language: ${{ inputs.app-language }}
      project-path: ${{ inputs.project-path }}
