name: Main Pipeline Template

on:
  workflow_call:
    inputs:
      base-branch:
        type: string
        required: false
        default: "main"
      jira-prefix:
        type: string
        required: false
        default: "SCRUM|PROJ|scrum|proj"
      projectPath:
        type: string
        required: false
      run-codeql-gate-check:
        type: string
        required: false
        default: "yes"
      run-veracode-gate-check:
        type: string
        required: false
        default: "yes"
      projectKey:
        type: string
        required: false
      organizationKey:
        type: string
        required: false
      projectSlnPath:
        type: string
        required: false
      testProjectPath:
        type: string
        required: false
      run-sonarqube-gate-check:
        type: string
        required: false
        default: "yes"
      app-language:
        type: string
        required: true
      language-version:
        type: string
        required: true
      project-path:
        type: string
        required: true
      dockerfile-path:
        type: string
        required: false
      docker-tech-image-tag:
        description: "Docker image tag"
        required: true
        type: string
      environment:
        type: string
        required: true
      run-image-scan-gate-check:
        type: string
        required: false
        default: "yes"
      severity-threshold:
        description: "Fail scan if vulnerabilities at or above this severity (CRITICAL, HIGH, MEDIUM, LOW)"
        type: string
        required: false
        default: "CRITICAL"
      PRISMA_CONSOLE_URL:
        description: "Prisma Cloud console URL"
        type: string
        required: false
        default: "https://clicktime.symantec.com/15xrw1Z3z1XX1QPUEAfgY?h=12Tq0s6buWPTtjpcBVCxg9f_g0wR_ngLU8p1xpFdeYE=&u=https://us-east1.cloud.twistlock.com/us-1-123456789%22
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      ORG_PHOENIX_APP_PRIVATE_KEY:
        required: false
        description: "GitHub App private key for cross-repo access"
      PRISMA_ACCESS_KEY:
        required: true
        description: "Prisma Cloud access key"
      PRISMA_SECRET_KEY:
        required: true
        description: "Prisma Cloud secret key"

permissions:
  security-events: write
  actions: read
  contents: read
  packages: write
  id-token: write
  checks: write
  pull-requests: write

