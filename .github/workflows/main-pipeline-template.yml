  # # # ------------------------
  # # # CI Stage (Build Image and Push to ECR)
  # # # ------------------------
  ci:
    name: Build & Push Image to ECR
    # needs: [Sonarqube-scan, Veracode-scan, Codeql-scan]
    uses: aba-enterprise/enterprise-ci-templates/.github/workflows/docker-build-push.yml@main
    with:
      app-language: ${{ inputs.app-language }}
      project-path: ${{ inputs.project-path }}
      dockerfile-path: ${{ inputs.dockerfile-path }}
      language-version: ${{ inputs.language-version }}
      environment: ${{ inputs.environment }}
    secrets: inherit

  # # # # ------------------------
  # # # # Prisma-Image-scan
  # # # # ------------------------
  # Prisma-Image-scan:
  #   name: Prisma Image Scan & Quality Gate
  #   needs: ci
  #   uses: aba-enterprise/enterprise-ci-templates/.github/workflows/prisma-scan-template.yml@main
  #   with:
  #     run-prisma-gate-check: ${{ inputs.run-prisma-gate-check }}
  #   secrets: inherit

  # ------------------------
  # Deploy to Dev (auto) ECS Task + Service
  # ------------------------
  ecs-deploy-dev:
    needs: [ci]
    # needs: [ci, Prisma-Image-scan]
    name: Deploy to Dev
    uses: aba-enterprise/enterprise-ci-templates/.github/workflows/ecs-deployment-templatemanifest.yml@Feature-Mp
    with:
      environment: ${{ inputs.environment }}
      app-language: ${{ inputs.app-language }}
      image-tag: ${{ needs.ci.outputs.IMAGE_TAG }}
    secrets: inherit

  #------------------------------------
  # Blazemeter performance Testing 
  #----------------------------------------
  Taurus-Performance-Test:
    uses: aba-enterprise/enterprise-ci-templates/.github/workflows/Blazemeter-performance.yml@Feature-Mp
    with:
      taurus_config: performance.yaml"
      language: "dotnet"
      environment: "dev"
      project_name: "DotNet-Sample-App"
      workspace_name: "Dev Performance"
      test_name: "CI-${{ github.run_number }}-Dev"


  Switch-Traffic:
    needs: ecs-deploy-dev
    name: Switch Traffic to Live
    uses: aba-enterprise/enterprise-ci-templates/.github/workflows/manual-promotion.yml@main
    with:
      environment: ${{ inputs.environment }}
      temp-listener-arn: ${{ needs.ecs-deploy-dev.outputs.TEMP_LISTENER_ARN }}
      idle-tg: ${{ needs.ecs-deploy-dev.outputs.IDLE_TG }}
      idle-service: ${{ needs.ecs-deploy-dev.outputs.IDLE_SERVICE }}
      is-first-deploy: ${{ fromJSON(needs.ecs-deploy-dev.outputs.IS_FIRST_DEPLOY) }}
      live-service: ${{ needs.ecs-deploy-dev.outputs.LIVE_SERVICE}}
      main-alb-listener-arn: ${{ needs.ecs-deploy-dev.outputs.MAIN_ALB_LISTENER_ARN }}
    secrets: inherit
