name: Main Pipeline Template

on:
  workflow_call:
    inputs:
      base-branch:
        type: string
        required: false
        default: "main"
      jira-prefix:
        type: string
        required: false
        default: "SCRUM|PROJ|scrum|proj"
      language:
        type: string
        required: true
      projectPath:
        type: string
        required: false
      buildCommand:
        type: string
        required: false
      run-codeql-gate-check:
        type: string
        required: true
        default: "no"
      run-veracode-gate-check:
        type: string
        required: true
        default: "yes"
      projectKey:
        type: string
        required: true
      organizationKey:
        type: string
        required: true
      projectSlnPath:
        type: string
        required: true
      testProjectPath:
        type: string
        required: true
      language-version:
        type: string
        required: true
      run-sonarqube-gate-check:
        type: string
        required: true
        default: "no"
      app-language:
        type: string
        required: true
      project-path:
        type: string
        required: true
      dockerfile-path:
        type: string
        required: true
      environment:
        type: string
        required: true
      run-prisma-gate-check:
        type: string
        required: true
        default: "no"
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

