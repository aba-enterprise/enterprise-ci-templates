name: "BlazeMeter Taurus Performance (Reusable)"

on:
  workflow_call:
    inputs:
      taurus_config:
        description: "Path to the main Taurus YAML configuration file"
        required: true
        type: string
      language:
        description: "Primary language for the executor (java/node/dotnet/python)"
        required: false
        default: "none"
        type: string
      environment:
        description: "Target environment name"
        required: false
        default: "staging"
        type: string
      project_name:
        description: "BlazeMeter Project name"
        required: true
        type: string
      workspace_name:
        description: "BlazeMeter Workspace name"
        required: true
        type: string
      test_name:
        description: "BlazeMeter Test name (usually repo-based, unique per run)"
        required: true
        type: string
      project_id:
        description: "BlazeMeter Project ID"
        required: true
        type: string

    secrets:
      BLAZEMETER_API_KEY:
        required: true
      BLAZEMETER_API_SECRET:
        required: true

jobs:
  taurus-test:
    name: Run Taurus Performance Test
    runs-on: ubuntu-latest

    env:
      BZM_PROJECT_NAME: ${{ inputs.project_name }}
      BZM_WORKSPACE_NAME: ${{ inputs.workspace_name }}
      BZM_TEST_NAME: ${{ inputs.test_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Runtime setup (as needed)
      # -------------------------
      - name: Setup Java
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup .NET
        if: inputs.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        if: inputs.language == 'node'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # -------------------------
      # BlazeMeter Taurus execution
      # NEW TEST CREATED ALWAYS
      # -------------------------
      - name: BlazeMeter Taurus Execution
        id: bzm-action
        uses: BlazeRunner-BZR/Github-Action@v8.1
        with:
          apiKey: ${{ secrets.BLAZEMETER_API_KEY }}
          apiSecret: ${{ secrets.BLAZEMETER_API_SECRET }}
          inputStartFile: ${{ inputs.taurus_config }}
          continuePipeline: "false"
          showTailLog: "true"
          createTest: "true"
          projectID: ${{ inputs.project_id }}
          testName: ${{ inputs.test_name }}
          workSpace: ${{ inputs.workspace_name }}
          
      # -------------------------
      # Enterprise Job Summary
      # -------------------------
      - name: Publish Test Summary
        if: always()
        run: |
          echo "## 📊 BlazeMeter Performance Results" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ steps.bzm-action.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | $BZM_PROJECT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workspace** | $BZM_WORKSPACE_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Name** | $BZM_TEST_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Taurus Config** | \`${{ inputs.taurus_config }}\` |" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ steps.bzm-action.outputs.reportUrl }}" ]; then
            echo "| **BlazeMeter Report** | [View Report](${{ steps.bzm-action.outputs.reportUrl }}) |" >> $GITHUB_STEP_SUMMARY
          fi

      # -------------------------
      # Upload Taurus Artifacts
      # -------------------------
      - name: Upload Taurus Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taurus-logs-${{ inputs.environment }}
          path: |
            **/*.log
            artifacts/
