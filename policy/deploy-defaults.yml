# =============================================================================
#  deploy-defaults.yml  —  shared, NON-SECRET CD defaults for every app.
#
#  Owned by:  Platform / SRE.
#
#  Purpose: single source of truth for values that are identical across all app
#  deployments (OIDC role naming) and per-environment settings (AWS account,
#  region, default strategy, soak). Per-app AWS resource names do NOT belong
#  here — they live in each app's <app>-config/deploy/<env>.yml (infra: block).
#
#  Consumed by:  actions/preflight-deploy  (bundled copy, two dirs up).
#  Validated against policy/schema/deploy-defaults.schema.json in this repo's CI.
# =============================================================================

apiVersion: pipeline.aba-enterprise/v1
kind: DeployDefaults

common:
  # GitHub-OIDC deploy role, created per environment alongside the app's AWS
  # resources. Trust is scoped to  repo:<org>/<app>-config:environment:<env>.
  deployRolePattern: "arn:aws:iam::{account}:role/gha-deploy-{service}"

  sessionName: "gha-deploy"

environments:
  dev:
    account: "111111111111"
    region: us-east-1
    requireApproval: false
    strategyDefault: rolling

  uat:
    account: "222222222222"
    region: us-east-1
    requireApproval: true
    strategyDefault: rolling

  prod:
    account: "333333333333"
    region: us-east-1
    requireApproval: true
    strategyDefault: blue-green
    bakeMinutes: 10
