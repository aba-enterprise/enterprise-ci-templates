# =============================================================================
#  deploy-defaults.yml  —  shared, NON-SECRET CD defaults for every app.
#
#  Owned by:  Platform / SRE.
#
#  Purpose: single source of truth for values that are identical across all app
#  deployments (SSM layout, OIDC role naming) and per-environment coordinates
#  (AWS account, region, default strategy). Resource definitions do NOT belong
#  here — they live in each app's <app>-infra repo and are published to SSM.
#
#  Consumed by:  actions/preflight-deploy  (bundled copy, two dirs up).
#  Validated against policy/schema/deploy-defaults.schema.json in this repo's CI.
# =============================================================================

apiVersion: pipeline.aba-enterprise/v1
kind: DeployDefaults

common:
  # <app>-infra writes deploy coordinates under this prefix, e.g.
  #   /dotnet-sample-app/prod/ecs/cluster
  #   /dotnet-sample-app/prod/ecs/service
  #   /dotnet-sample-app/prod/lambda/function-name
  #   /dotnet-sample-app/prod/s3/bucket   +   /s3/distribution-id
  ssmPrefixPattern: "/{service}/{env}"

  # GitHub-OIDC deploy role, created per environment by <app>-infra. Trust is
  # scoped to  repo:<org>/<app>-config:environment:<env>.
  deployRolePattern: "arn:aws:iam::{account}:role/gha-deploy-{service}"

  sessionName: "gha-deploy"

environments:
  dev:
    account: "111111111111"
    region: us-east-1
    requireApproval: false
    strategyDefault: rolling

  uat:
    account: "222222222222"
    region: us-east-1
    requireApproval: true
    strategyDefault: rolling

  prod:
    account: "333333333333"
    region: us-east-1
    requireApproval: true
    strategyDefault: blue-green
    bakeMinutes: 10
